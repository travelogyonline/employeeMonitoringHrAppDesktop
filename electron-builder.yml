appId: com.company.travelbuddy
productName: Travel Buddy

directories:
  output: dist
  buildResources: build

files:
  - dist-react/**
  - dist-electron/**
  - package.json

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: true
